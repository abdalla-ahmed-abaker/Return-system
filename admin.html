<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم المشرف — نظام العودة الطوعية للسودان</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <h1>
    <span class="flag-strip"><span class="r"></span><span class="w"></span><span class="b"></span></span>
    لوحة تحكم المشرف
  </h1>
  <div class="topbar-actions" id="topActions" style="display:none;">
    <button id="changePwBtn">تغيير كلمة المرور</button>
    <button id="logoutBtn">تسجيل الخروج</button>
  </div>
</div>

<!-- ========== تسجيل الدخول / إنشاء كلمة المرور ========== -->
<div class="container login-wrap" id="loginView">
  <div class="card">
    <h2 class="form-title" id="loginTitle">تسجيل دخول المشرف</h2>
    <p class="form-subtitle" id="loginSubtitle">أدخل كلمة المرور للمتابعة.</p>

    <form id="loginForm" novalidate>
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" autocomplete="current-password">

      <div id="confirmWrap" style="display:none;">
        <label for="password2">تأكيد كلمة المرور</label>
        <input type="password" id="password2" autocomplete="new-password">
      </div>

      <div class="error-msg" id="loginError"></div>
      <button type="submit" class="btn" id="loginBtn">دخول</button>
    </form>
  </div>
</div>

<!-- ========== لوحة التحكم ========== -->
<div class="admin-wrap" id="dashboardView" style="display:none;">

  <div class="stat-grid" id="statGrid"></div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 بحث بالاسم أو الهاتف أو البريد...">
    <select id="statusFilter">
      <option value="">كل الحالات</option>
      <option value="pending">قيد الانتظار</option>
      <option value="under_review">قيد المراجعة</option>
      <option value="approved">تمت الموافقة</option>
      <option value="scheduled">تم الجدولة</option>
      <option value="completed">مكتمل</option>
      <option value="rejected">مرفوض</option>
    </select>
    <div class="spacer"></div>
    <button class="btn btn-sm" id="exportBtn">⬇ تصدير Excel</button>
    <button class="btn btn-sm secondary" id="importBtn">⬆ استيراد Excel</button>
    <button class="btn btn-sm secondary" id="linkBtn">🔗 ربط ملف Excel</button>
    <button class="btn btn-sm secondary" id="saveNowBtn" style="display:none;">💾 حفظ الآن في الملف</button>
    <input type="file" id="importInput" accept=".xlsx,.xls" style="display:none;">
  </div>

  <div class="file-status" id="fileStatus"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>الاسم الكامل</th><th>الهاتف</th><th>الجنس</th>
          <th>طوعي؟</th><th>اكتمل؟</th><th>الحالة</th><th>تاريخ السفر</th><th>تاريخ التقديم</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;">لا توجد طلبات مطابقة</div>
  </div>

  <div class="pagination" id="pagination"></div>
</div>

<!-- ========== نافذة تفاصيل الطلب ========== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="close-btn" id="closeModalBtn">✕</button>
    <h3>تفاصيل الطلب</h3>
    <div id="modalBody"></div>

    <label>الحالة</label>
    <select id="modalStatus">
      <option value="pending">قيد الانتظار</option>
      <option value="under_review">قيد المراجعة</option>
      <option value="approved">تمت الموافقة</option>
      <option value="scheduled">تم الجدولة</option>
      <option value="completed">مكتمل</option>
      <option value="rejected">مرفوض</option>
    </select>

    <label>تاريخ السفر</label>
    <input type="date" id="modalTravelDate">

    <label>ملاحظات المشرف</label>
    <textarea id="modalNotes" placeholder="ملاحظات داخلية حول هذا الطلب..."></textarea>

    <div class="btn-row">
      <button class="btn danger" id="deleteBtn">حذف الطلب</button>
      <button class="btn" id="saveModalBtn">حفظ التغييرات</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/db.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
