<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام العودة الطوعية للسودان</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <h1>
    <span class="flag-strip"><span class="r"></span><span class="w"></span><span class="b"></span></span>
    نظام العودة الطوعية للسودان
  </h1>
</div>

<div class="container">
  <div class="steps">
    <div class="step-dot active">1</div>
    <div class="step-line"></div>
    <div class="step-dot">2</div>
  </div>

  <div class="card">
    <h2 class="form-title">بيانات مقدّم الطلب</h2>
    <p class="form-subtitle">الرجاء تعبئة البيانات التالية بدقة لتسجيل طلب العودة الطوعية إلى السودان.</p>

    <form id="step1Form" novalidate>
      <label for="full_name">الاسم الكامل <span class="req">*</span></label>
      <input type="text" id="full_name" placeholder="مثال: محمد أحمد " autocomplete="name">

      <label for="phone">رقم التلفون <span class="req">*</span></label>
      <input type="tel" id="phone" placeholder="مثال: 0912345678" autocomplete="tel">

      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" placeholder="example@email.com" autocomplete="email">

      <label>الجنس <span class="req">*</span></label>
      <div class="gender-group">
        <label class="radio-card"><input type="radio" name="gender" value="male">ذكر</label>
        <label class="radio-card"><input type="radio" name="gender" value="female">أنثى</label>
      </div>

      <label>صورة من جواز السفر <span class="req">*</span></label>
      <label class="file-drop" id="fileDrop">
        <input type="file" id="passport_image" accept=".jpg,.jpeg,.png,.pdf">
        <span id="fileDropText">اضغط هنا لاختيار صورة الجواز أو ملف PDF</span>
        <small>الحد الأقصى: 5 ميغابايت — الصيغ المسموحة: JPG, PNG, PDF</small>
      </label>

      <div class="error-msg" id="errorBox"></div>
      <button type="submit" class="btn" id="submitBtn">التالي ←</button>
    </form>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
